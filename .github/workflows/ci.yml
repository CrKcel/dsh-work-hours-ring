# Continuous integration for the plugin sources and the committed bundle.
#
# `client.js` is a committed build output and `package.json` deliberately carries no
# `prepare` script (see AGENTS.md), so the only thing keeping an installed profile
# honest is the byte-for-byte freshness check in `test/artifact.test.js`. `npm test`
# runs that check first: it regenerates the bundle and compares, so a source edit that
# was not rebuilt fails here — red on the pull request instead of stale bytes on `main`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this job only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build and test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 = maintenance LTS, 24 = active LTS, 26 = current. The plugin runs in the
        # page, but build.mjs, the tests and the freshness check all run on Node.
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install build inputs (chinese-days)
        run: npm ci
      - name: Verify the committed bundle, then the time model and the protocol
        run: npm test
